name: Wrong verdict
description: rldoctor said something about your run that is not true -- or missed something that is.
labels: [wrong-verdict]
body:
  - type: markdown
    attributes:
      value: |
        This is the most valuable issue you can file. A false positive is treated as a
        higher-severity bug than a missed detection: a diagnostic that cries wolf gets
        uninstalled, and then it catches nothing.
  - type: dropdown
    id: kind
    attributes:
      label: Which way was it wrong?
      options:
        - It warned about a run that was fine (false positive)
        - It missed a problem the run really had (false negative)
        - The finding was right but the explanation or the fix was wrong
    validations:
      required: true
  - type: input
    id: detector
    attributes:
      label: Which detector
      placeholder: e.g. entropy_collapse
  - type: textarea
    id: truth
    attributes:
      label: What was actually going on in the run
      description: How you know -- held-out results, rollouts you read, what you changed.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: The log
      description: |
        A link to a public W&B run or trainer_state.json, or an attached CSV of the
        relevant series. The full log is not needed -- the columns the detector reads are.
  - type: input
    id: framework
    attributes:
      label: Framework and version
      placeholder: verl 0.6 / TRL 1.2 / custom
